  color-scheme:light;
  --bg:#F4F6FB; --white:#FFFFFF; --ink:#0B1433; --muted:#5A6583; --line:#E1E6F0;
  --blue:#0B4FE8; --blue-dark:#0839B0; --navy:#050E4A; --navy-2:#0A1C7A; --sky:#EAF0FE;
  --green:#16A34A; --wa:#1FAF5A; --yellow:#FFC928; --red:#E11D48;
  --f-display:"Archivo",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
svg.i{width:20px;height:20px;flex:none}

/* Bandeau haut */
.topbar{background:var(--navy);color:#C9D4FF;font-size:13px}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding-block:8px}
.topbar span,.topbar a{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.topbar a:hover{color:#fff}
.topbar svg{width:14px;height:14px}
.topbar .right{margin-left:auto;display:flex;gap:18px}
@media (max-width:760px){.topbar .hide-m{display:none}.topbar .right{margin-left:0}}

/* En-tête */
.header{background:var(--white);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 1px 0 var(--line)}
.header .wrap{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.logo img{width:52px;height:52px;border-radius:50%}
.logo b{font-family:var(--f-display);font-weight:900;font-size:21px;letter-spacing:.01em;color:var(--navy);display:block;line-height:1}
.logo small{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.search{flex:1;display:flex;min-width:0;max-width:620px;margin-inline:auto;border:2px solid var(--blue);border-radius:10px;overflow:hidden;background:var(--white)}
.search input{flex:1;min-width:0;border:0;padding:11px 14px;font:15px var(--f-body);color:var(--ink);outline:none}
.search button{border:0;background:var(--blue);color:#fff;padding:0 18px;cursor:pointer;display:grid;place-items:center}
.hbtns{display:flex;gap:10px;flex:none}
.hbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--white);border-radius:10px;padding:9px 12px;cursor:pointer;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink);position:relative}
.hbtn small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.1}
.hbtn.wa svg{color:var(--wa)}
.hbtn .count{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11.5px;display:grid;place-items:center;padding:0 5px}
@media (max-width:900px){.hbtn .t{display:none}}
@media (max-width:700px){.header .wrap{flex-wrap:wrap;gap:12px}.search{order:3;flex-basis:100%;max-width:none}.hbtns{margin-left:auto}.logo img{width:44px;height:44px}.logo b{font-size:18px}}

/* Menu catégories */
.catnav{background:var(--blue)}
.catnav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.catnav .wrap::-webkit-scrollbar{display:none}
.catnav button,.catnav a{flex:none;border:0;background:transparent;color:#fff;font-weight:600;font-size:14.5px;padding:12px 14px;cursor:pointer;text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent}
.catnav button:hover,.catnav a:hover,.catnav .on{border-bottom-color:var(--yellow);background:rgba(255,255,255,.08)}

/* Carrousel */
.hero{padding-block:22px 0}
.slider{position:relative;border-radius:16px;overflow:hidden;background:var(--navy);height:clamp(300px,34vw,430px);color:#fff}
.slide{position:absolute;inset:0;display:flex;align-items:center;opacity:0;visibility:hidden;transition:opacity .6s}
.slide.on{opacity:1;visibility:visible}
.slide .bgimg{position:absolute;inset:0;background-size:cover;background-position:center 55%}
.slide .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,14,74,.94) 0%,rgba(5,14,74,.7) 42%,rgba(5,14,74,.05) 78%)}
.slide.s2{background:radial-gradient(circle at 78% 40%,#2F6BFF 0%,transparent 45%),linear-gradient(120deg,#050E4A,#0A2BA8)}
.slide.s3{background:radial-gradient(circle at 80% 50%,rgba(255,201,40,.28) 0%,transparent 42%),linear-gradient(120deg,#07102F,#0B1F66)}
.slide .txt{position:relative;padding:0 clamp(24px,5vw,64px);max-width:600px}
.slide .kicker{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px}
.slide h1,.slide h2{font-size:clamp(30px,4.4vw,54px);font-weight:900;margin:14px 0 12px}
.slide p{font-size:clamp(15px,1.4vw,18px);color:#D7E0FF;margin:0 0 22px;max-width:44ch}
.slide .art{position:absolute;right:clamp(10px,5vw,70px);top:50%;transform:translateY(-50%);width:clamp(220px,34vw,440px);height:auto}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:12px 20px;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer}
.btn-y{background:var(--yellow);color:var(--navy)}
.btn-w{background:#fff;color:var(--navy)}
.btn-wa{background:var(--wa);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}
.dots button{width:10px;height:10px;border-radius:5px;border:0;background:rgba(255,255,255,.45);cursor:pointer;padding:0;transition:width .3s}
.dots button.on{width:28px;background:#fff}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
.arrow:hover{background:rgba(255,255,255,.28)}
.arrow.prev{left:12px}.arrow.next{right:12px}
@media (max-width:760px){.slider{height:440px}.slide{align-items:flex-end;padding-bottom:48px}.slide .art{top:20px;transform:none;left:50%;right:auto;margin-left:-120px;width:240px}.slide .shade{background:linear-gradient(0deg,rgba(5,14,74,.95) 35%,rgba(5,14,74,.35))}.arrow{display:none}}

/* Barre de confiance */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-top:18px}
.trust div{display:flex;gap:12px;align-items:center;padding:16px 18px}
.trust div+div{border-left:1px solid var(--line)}
.trust .ic{width:44px;height:44px;border-radius:50%;background:var(--sky);color:var(--blue);display:grid;place-items:center;flex:none}
.trust b{display:block;font-size:14.5px}
.trust span{font-size:13px;color:var(--muted)}
@media (max-width:900px){.trust{grid-template-columns:1fr 1fr}.trust div:nth-child(3){border-left:0}.trust div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:480px){.trust{grid-template-columns:1fr}.trust div+div{border-left:0;border-top:1px solid var(--line)}}

/* Sections */
section{padding-block:40px 8px}
.shead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.shead h2{font-size:clamp(22px,2.6vw,30px);font-weight:850;position:relative;padding-left:14px}
.shead h2::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:5px;border-radius:3px;background:var(--blue)}
.shead .more{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer;font-size:14.5px}
.shead .more:hover{text-decoration:underline}

/* Tuiles catégories */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 14px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.cat:hover{transform:translateY(-3px);box-shadow:0 12px 24px -16px rgba(11,20,51,.35);border-color:var(--blue)}
.cat svg{width:100%;max-width:150px;height:auto;aspect-ratio:200/140}
.cat b{display:block;font-size:15px;margin-top:6px}
.cat span{font-size:13px;color:var(--muted)}
@media (max-width:900px){.cats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,1fr)}}

/* Produits */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 14px 30px -18px rgba(11,20,51,.35);border-color:#C9D5F5}
.card .pic{position:relative;background:linear-gradient(180deg,#F7F9FE,#EDF2FD);aspect-ratio:4/3;display:grid;place-items:center;padding:14px}
.card .pic svg{width:82%;height:auto}
.badge{position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--blue);color:#fff}
.badge.stu{background:var(--yellow);color:var(--navy)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .cname{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card h3{font-family:var(--f-body);font-size:15.5px;font-weight:700;line-height:1.3}
.card .specs{font-size:13px;color:var(--muted);margin:0}
.stock{font-size:12.5px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:5px}
.stock::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.card .price{font-family:var(--f-display);font-weight:850;font-size:21px;color:var(--blue);margin-top:auto;padding-top:4px;font-variant-numeric:tabular-nums}
.card .price small{font-size:13px}
.card .acts{display:grid;grid-template-columns:1fr auto;gap:8px}
.card .acts a{justify-content:center;padding:10px 8px;font-size:13.5px;border-radius:8px}
.card .add{border:1px solid var(--line);background:var(--white);border-radius:8px;width:42px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.card .add:hover,.card .add.done{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (max-width:420px){.card .acts a span{display:none}}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--white);padding:7px 13px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}

/* Atelier */
.atelier{margin-top:40px;background:var(--navy);color:#fff;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr}
.atelier .l{padding:clamp(24px,4vw,44px)}
.atelier h2{font-size:clamp(24px,3vw,36px);font-weight:900;margin:10px 0 12px}
.atelier p{color:#C9D4FF;margin:0 0 20px;max-width:48ch}
.atelier ul{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px}
.atelier li{display:flex;gap:10px;align-items:flex-start}
.atelier li svg{color:var(--yellow);margin-top:2px}
.atelier .r{background:radial-gradient(circle at 50% 50%,#1D46D6 0%,transparent 65%),var(--navy-2);display:grid;place-items:center;padding:24px}
.atelier .r svg{width:min(360px,100%);height:auto}
@media (max-width:820px){.atelier{grid-template-columns:1fr}.atelier .r{order:-1;padding:20px}.atelier .r svg{width:240px}}

/* Marques */
.brands{display:flex;flex-wrap:wrap;gap:10px}
.brands span{flex:1 1 120px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px 10px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.04em;color:#8C96B2}

/* Pied de page */
footer{background:var(--navy);color:#C9D4FF;margin-top:48px;padding-block:40px 90px;font-size:14px}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:28px}
@media (max-width:860px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
footer h4{color:#fff;font-family:var(--f-display);font-size:16px;margin:0 0 12px}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
footer a{text-decoration:none}
footer a:hover{color:#fff}
footer button.flink{border:0;background:none;color:inherit;padding:0;cursor:pointer;font-size:14px;text-align:left}
footer button.flink:hover{color:#fff}
.flogo{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.flogo img{width:56px;height:56px;border-radius:50%;background:#fff}
.flogo b{font-family:var(--f-display);font-size:20px;color:#fff}
.copyl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy{border:1px solid rgba(255,255,255,.25);background:transparent;color:#C9D4FF;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.fbottom{border-top:1px solid rgba(255,255,255,.12);margin-top:28px;padding-top:18px;font-size:13px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);border-radius:999px}

/* Panier */
.drawer-bg{position:fixed;inset:0;background:rgba(5,10,30,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--white);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.d-head h3{font-size:20px}
.x{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--ink)}
.d-items{flex:1;overflow:auto;padding:6px 20px}
.d-item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding-block:14px;border-bottom:1px solid var(--line)}
.d-item .n{font-weight:600;min-width:0}
.d-item .p{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;text-align:right}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:16px}
.rm{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;justify-self:end}
.d-foot{border-top:1px solid var(--line);padding:18px 20px;display:grid;gap:12px}
.total{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:850;font-size:22px}
.d-foot label{font-size:13.5px;color:var(--muted);display:grid;gap:6px}
.d-foot input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:15px var(--f-body)}
.d-foot .btn{justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Bannières rendues depuis les données */
#slides{position:absolute;inset:0}
.slide{background:radial-gradient(circle at 78% 40%,#2F6BFF 0%,transparent 45%),linear-gradient(120deg,#050E4A,#0A2BA8)}
.slide.v1{background:radial-gradient(circle at 80% 50%,rgba(255,201,40,.28) 0%,transparent 42%),linear-gradient(120deg,#07102F,#0B1F66)}
.slide.v2{background:radial-gradient(circle at 75% 45%,rgba(34,211,238,.3) 0%,transparent 45%),linear-gradient(120deg,#050E4A,#122C9A)}
.slide.has-img{background:var(--navy)}

/* Fiches produits */
.card .pic img{width:100%;height:100%;object-fit:contain}
.badge.promo{background:var(--red)}
.card .price .old{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);text-decoration:line-through;margin-left:8px}

/* Bouton administrateur */
.adm-pill{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:36;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:12px 16px;font:700 14px var(--f-body);display:flex;gap:8px;align-items:center;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);cursor:pointer}
.adm-pill.dirty{background:#B45309}
@media (max-width:520px){.adm-pill span{display:none}.adm-pill{padding:13px}}

/* Espace administrateur */
.adm{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:60;background:#fff;display:flex;flex-direction:column;box-shadow:-24px 0 60px -24px rgba(0,0,0,.45);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:var(--ink)}
@media (min-width:1100px){body.adm-on{padding-right:520px}}
body.adm-on .adm-pill,body.adm-on .fab{display:none}
.adm-h{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--navy);color:#fff;flex:none}
.adm-h h3{font-size:18px;flex:1}
.adm-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px;flex:none;scrollbar-width:none}
.adm-tabs button{border:0;background:none;padding:12px 10px;font:600 14px var(--f-body);color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.adm-tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.adm-b{flex:1;overflow:auto;padding:16px 18px 24px;display:grid;gap:14px;align-content:start}
.adm-f{border-top:1px solid var(--line);padding:12px 18px;display:grid;gap:10px;flex:none;background:#fff}
.adm-st{font-size:13px;color:var(--muted)}
.adm-st.warn{color:#B45309;font-weight:600}
.adm-st.ok{color:var(--green);font-weight:600}
.adm-st.err{color:var(--red);font-weight:600}
.adm-row2{display:flex;gap:10px;flex-wrap:wrap}
.adm-help{font-size:13px;color:var(--muted);margin:0;background:var(--sky);border-radius:10px;padding:10px 12px}
.af{display:grid;gap:5px;align-content:start;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.af input,.af textarea,.af select{font:15px var(--f-body);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;width:100%;min-width:0}
.af input:focus,.af textarea:focus,.af select:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.af textarea{min-height:76px;resize:vertical}
.af small{font-weight:400;font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
.abox{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.abox-h{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.abox-h h4{margin:0;font-size:15px;font-family:var(--f-display)}
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.prow .th{width:56px;height:42px;border-radius:6px;background:#EEF2FB;display:grid;place-items:center;overflow:hidden}
.prow .th img{width:100%;height:100%;object-fit:contain}
.prow .th svg{width:50px;height:auto}
.prow .nm{min-width:0}
.prow b{display:block;font-size:14px;overflow-wrap:anywhere}
.prow .nm span{font-size:12.5px;color:var(--muted)}
@media (max-width:480px){.prow{grid-template-columns:56px 1fr}.prow .ib{grid-column:1/-1}}
.ib{display:flex;gap:4px;flex-wrap:wrap}
.sb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font:500 13px var(--f-body);cursor:pointer;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sb:hover{border-color:var(--blue)}
.sb.danger{color:var(--red)}
.sb.danger.arm{background:var(--red);color:#fff;border-color:var(--red)}
.sb:disabled{opacity:.4;cursor:not-allowed}
.sb.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}

<script id="app">
(function(){
  "use strict";
  // ---- Source canonique de la page (servira à republier le site) ----
  var TPL = document.getElementById("shell");
  var CSS = document.getElementById("css").textContent;
  var SHELL = TPL.innerHTML;
  var APP = document.getElementById("app").textContent;
  var FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">';
  var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}';
  var DATA_TXT = document.getElementById("data").textContent;
  var D = JSON.parse(DATA_TXT);          // ce qui est publié
  var W = null;                          // brouillon de l'administrateur
  var S = D;                             // ce qui est affiché

  document.body.appendChild(TPL.content.cloneNode(true));

  // ---- Outils ----
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmt(n){ n = Number(n) || 0; return n.toLocaleString("fr-FR").replace(/[  ]/g, " ") + " DA"; }
  function waNum(s){ var d = String(s || "").replace(/\D/g, ""); if (d.charAt(0) === "0") d = "213" + d.slice(1); return d; }
  function wa(t){ return "https://wa.me/" + waNum(S.store.whatsapp || S.store.phone1) + (t ? "?text=" + encodeURIComponent(t) : ""); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function catOf(id){ for (var i = 0; i < S.cats.length; i++) if (S.cats[i].id === id) return S.cats[i]; return { id: id, label: "Autres", art: "p-gpu" }; }
  function shown(){ return S.products.filter(function(p){ return !p.hidden; }); }
  function isPromo(p){ return Number(p.oldPrice) > Number(p.price); }
  var ARTS = [["p-laptop","PC portable"],["p-gamer","PC gamer"],["p-gpu","Carte graphique / composant"],["p-acc","Clavier, souris, casque"],["p-print","Imprimante"],["p-router","Routeur / réseau"]];
  var ICONS = [["i-user","Personne"],["i-chat","Message"],["i-tool","Outil"],["i-store","Magasin"],["i-truck","Livraison"],["i-shield","Garantie"],["i-card","Paiement"],["i-phone","Téléphone"],["i-check","Validé"]];
  var tt;
  function toast(m){ var el = $("toast"); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ el.hidden = true; }, 2600); }

  // ---- Panier (propre à chaque visiteur) ----
  var cart = {};
  try { var c0 = JSON.parse(localStorage.getItem("infoweb-cart") || "{}"); if (c0 && typeof c0 === "object") cart = c0; } catch(e) {}
  function saveCart(){ try { localStorage.setItem("infoweb-cart", JSON.stringify(cart)); } catch(e) {} }

  // ---- Rendu du site ----
  var view = { mode: "home", cat: null, q: "" };

  function renderStatic(){
    var st = S.store;
    document.title = st.name || "ETS INFOWEB";
    document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = st[el.getAttribute("data-t")] || ""; });
    document.querySelectorAll("img[data-logo]").forEach(function(i){ if (S.logo) i.src = S.logo; i.hidden = !S.logo; });
    document.querySelectorAll("a.wa-link").forEach(function(a){ a.href = wa(""); });
    $("tbP2").hidden = !st.phone2;
    $("yr").textContent = new Date().getFullYear();
    $("note").textContent = S.note || "";
    $("about").textContent = st.about || "";
    var phones = [st.phone1, st.phone2].filter(Boolean).join(" ou le ");
    $("cartHelp").textContent = "WhatsApp s'ouvre avec votre commande déjà écrite : il reste à appuyer sur Envoyer." + (phones ? " Vous pouvez aussi appeler le " + phones + "." : "");
  }

  var cur = 0, timer;
  function renderSlides(){
    var box = $("slides"); box.innerHTML = "";
    var dots = $("dots"); dots.innerHTML = "";
    S.slides.forEach(function(s, i){
      var d = document.createElement("div");
      d.className = "slide v" + (i % 3) + (s.image ? " has-img" : "");
      var h = i === 0 ? "h1" : "h2";
      var btn = "";
      if (s.btn && s.action && s.action !== "none") {
        if (s.action === "devis") btn = '<a class="btn btn-wa" target="_blank" rel="noopener"><svg class="i"><use href="#i-wa"/></svg>' + esc(s.btn) + '</a>';
        else btn = '<button type="button" class="btn ' + (i % 2 ? "btn-w" : "btn-y") + '">' + esc(s.btn) + '</button>';
      }
      d.innerHTML = (s.image ? '<div class="bgimg"></div><div class="shade"></div>' : '<svg class="art" viewBox="0 0 200 140" aria-hidden="true"><use href="#' + esc(s.art || "p-laptop") + '"/></svg>') +
        '<div class="txt">' + (s.kicker ? '<span class="kicker">' + esc(s.kicker) + '</span>' : "") + "<" + h + ">" + esc(s.title) + "</" + h + ">" + (s.text ? "<p>" + esc(s.text) + "</p>" : "") + btn + "</div>";
      if (s.image) d.querySelector(".bgimg").style.backgroundImage = 'url("' + s.image + '")';
      var a = d.querySelector("a.btn"); if (a) a.href = wa("Bonjour " + S.store.name + ", je souhaite un devis pour une réparation.");
      var b = d.querySelector("button.btn"); if (b) b.onclick = function(){ slideGo(s.action); };
      box.appendChild(d);
      var dot = document.createElement("button"); dot.type = "button"; dot.setAttribute("aria-label", "Bannière " + (i + 1));
      dot.onclick = function(){ go(i); restart(); }; dots.appendChild(dot);
    });
    var many = S.slides.length > 1;
    $("prev").hidden = !many; $("next").hidden = !many; dots.hidden = !many;
    $("slider").hidden = !S.slides.length;
    go(Math.min(cur, Math.max(0, S.slides.length - 1)));
  }
  function slideGo(a){
    if (a === "atelier") { $("atelier").scrollIntoView({ behavior: "smooth" }); return; }
    if (a === "catalogue") { $("catalogue").scrollIntoView({ behavior: "smooth" }); return; }
    if (a && a.indexOf("cat:") === 0) showCat(a.slice(4));
  }
  function go(i){
    var sl = $("slides").children; if (!sl.length) return;
    cur = (i + sl.length) % sl.length;
    [].forEach.call(sl, function(s, k){ s.classList.toggle("on", k === cur); });
    [].forEach.call($("dots").children, function(d, k){ d.classList.toggle("on", k === cur); });
  }
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function restart(){ clearInterval(timer); if (!reduce && S.slides.length > 1) timer = setInterval(function(){ go(cur + 1); }, 6000); }
  $("prev").onclick = function(){ go(cur - 1); restart(); };
  $("next").onclick = function(){ go(cur + 1); restart(); };
  $("slider").addEventListener("mouseenter", function(){ clearInterval(timer); });
  $("slider").addEventListener("mouseleave", restart);

  function renderTrust(){
    var box = $("trust"); box.innerHTML = "";
    S.trust.forEach(function(t){
      var d = document.createElement("div");
      d.innerHTML = '<span class="ic"><svg class="i"><use href="#' + esc(t.icon || "i-check") + '"/></svg></span><p style="margin:0"><b>' + esc(t.title) + "</b><span>" + esc(t.text) + "</span></p>";
      box.appendChild(d);
    });
    box.hidden = !S.trust.length;
  }

  function renderNav(){
    var nav = $("catnav"), cats = $("cats"), fcats = $("fcats");
    nav.innerHTML = ""; cats.innerHTML = ""; fcats.innerHTML = "";
    var home = document.createElement("button"); home.type = "button"; home.textContent = "Accueil"; home.dataset.home = "1";
    home.onclick = function(){ showHome(true); }; nav.appendChild(home);
    S.cats.forEach(function(c){
      var n = shown().filter(function(p){ return p.cat === c.id; }).length;
      var b = document.createElement("button"); b.type = "button"; b.textContent = c.label; b.dataset.cat = c.id;
      b.onclick = function(){ showCat(c.id); }; nav.appendChild(b);
      var t = document.createElement("button"); t.type = "button"; t.className = "cat";
      t.innerHTML = '<svg viewBox="0 0 200 140" aria-hidden="true"><use href="#' + esc(c.art) + '"/></svg><b>' + esc(c.label) + "</b><span>" + n + " produit" + (n > 1 ? "s" : "") + "</span>";
      t.onclick = function(){ showCat(c.id); }; cats.appendChild(t);
      var li = document.createElement("li"), fb = document.createElement("button");
      fb.className = "flink"; fb.type = "button"; fb.textContent = c.label; fb.onclick = function(){ showCat(c.id); };
      li.appendChild(fb); fcats.appendChild(li);
    });
    var ra = document.createElement("a"); ra.href = "#atelier"; ra.textContent = "Réparation & réseaux"; nav.appendChild(ra);
    var ca = document.createElement("a"); ca.href = "#contact"; ca.textContent = "Contact"; nav.appendChild(ca);
    markNav();
  }
  function markNav(){
    [].forEach.call($("catnav").children, function(b){
      b.classList.toggle("on", view.mode === "home" ? !!b.dataset.home : (!!b.dataset.cat && b.dataset.cat === view.cat));
    });
  }

  function card(p){
    var c = catOf(p.cat), inCart = !!cart[p.id], promo = isPromo(p);
    var el = document.createElement("article"); el.className = "card";
    var badge = p.badge ? '<span class="badge' + (p.stu ? " stu" : "") + (promo && !p.stu ? " promo" : "") + '">' + esc(p.badge) + "</span>"
      : (promo ? '<span class="badge promo">-' + Math.round(100 - 100 * p.price / p.oldPrice) + " %</span>" : "");
    el.innerHTML = '<div class="pic">' + badge + (p.image ? '<img alt="" loading="lazy">' : '<svg viewBox="0 0 200 140" aria-hidden="true"><use href="#' + esc(p.art || c.art) + '"/></svg>') + "</div>" +
      '<div class="body"><span class="cname">' + esc(c.label) + "</span><h3>" + esc(p.name) + '</h3><p class="specs">' + esc(p.specs) + "</p>" +
      (p.stock ? '<span class="stock">' + esc(p.stock) + "</span>" : "") +
      '<div class="price">' + fmt(p.price) + (promo ? '<span class="old">' + fmt(p.oldPrice) + "</span>" : "") + "</div>" +
      '<div class="acts"><a class="btn btn-wa" target="_blank" rel="noopener"><svg class="i"><use href="#i-wa"/></svg><span>Commander</span></a>' +
      '<button class="add' + (inCart ? " done" : "") + '" type="button" aria-label="Ajouter au panier"><svg class="i"><use href="#i-' + (inCart ? "check" : "plus") + '"/></svg></button></div></div>';
    if (p.image) { var im = el.querySelector("img"); im.src = p.image; im.alt = p.name; }
    el.querySelector("a").href = wa("Bonjour " + S.store.name + ", je souhaite commander : " + p.name + " (" + fmt(p.price) + "). Est-il disponible ?");
    el.querySelector(".add").onclick = function(){ cart[p.id] = (cart[p.id] || 0) + 1; saveCart(); updateCart(); refresh(); toast(p.name + " ajouté au panier"); };
    return el;
  }
  function shelf(title, items, moreFn){
    var sec = document.createElement("div"); sec.style.marginBottom = "34px";
    sec.innerHTML = '<div class="shead"><h2></h2>' + (moreFn ? '<button class="more" type="button">Voir tout (' + items.length + ") →</button>" : "") + "</div>";
    sec.querySelector("h2").textContent = title;
    if (moreFn) sec.querySelector(".more").onclick = moreFn;
    var g = document.createElement("div"); g.className = "grid";
    items.slice(0, 4).forEach(function(p){ g.appendChild(card(p)); });
    sec.appendChild(g); return sec;
  }
  function renderShelves(){
    var box = $("shelves"); box.innerHTML = "";
    var promos = shown().filter(isPromo);
    if (promos.length) box.appendChild(shelf("Promotions", promos, promos.length > 4 ? function(){ view = { mode: "list", cat: null, q: "", promo: true }; showList(); } : null));
    S.cats.forEach(function(c){
      var items = shown().filter(function(p){ return p.cat === c.id; });
      if (items.length) box.appendChild(shelf(c.label, items, function(){ showCat(c.id); }));
    });
  }
  function renderResults(){
    var q = (view.q || "").toLowerCase();
    var list = shown().filter(function(p){
      if (view.promo && !isPromo(p)) return false;
      if (view.cat && p.cat !== view.cat) return false;
      return !q || (p.name + " " + p.specs + " " + catOf(p.cat).label + " " + (p.badge || "")).toLowerCase().indexOf(q) > -1;
    });
    $("resTitle").textContent = view.q ? "Résultats pour « " + view.q + " »" : (view.promo ? "Promotions" : (view.cat ? catOf(view.cat).label : "Tous les produits"));
    var chips = $("chips"); chips.innerHTML = "";
    [{ id: null, label: "Toutes" }].concat(S.cats).forEach(function(c){
      var b = document.createElement("button"); b.type = "button"; b.className = "chip" + (view.cat === c.id ? " on" : ""); b.textContent = c.label;
      b.onclick = function(){ view.cat = c.id; view.promo = false; renderResults(); markNav(); }; chips.appendChild(b);
    });
    var g = $("resGrid"); g.innerHTML = ""; list.forEach(function(p){ g.appendChild(card(p)); });
    $("empty").hidden = list.length > 0;
  }
  function refresh(){ if (view.mode === "home") renderShelves(); else renderResults(); }
  function showHome(scroll){ view = { mode: "home", cat: null, q: "" }; $("q").value = ""; $("results").hidden = true; $("shelves").hidden = false; renderShelves(); markNav(); if (scroll) window.scrollTo({ top: 0, behavior: "smooth" }); }
  function showList(){ $("results").hidden = false; $("shelves").hidden = true; renderResults(); markNav(); $("catalogue").scrollIntoView({ behavior: "smooth" }); }
  function showCat(id){ view = { mode: "list", cat: id, q: "" }; $("q").value = ""; showList(); }
  $("searchForm").addEventListener("submit", function(e){ e.preventDefault(); var v = $("q").value.trim(); if (!v) { showHome(); return; } view = { mode: "list", cat: null, q: v }; showList(); });
  $("backHome").onclick = function(){ showHome(); $("catalogue").scrollIntoView({ behavior: "smooth" }); };

  function renderAtelier(){
    var a = S.atelier, box = $("atelierL");
    box.innerHTML = (a.kicker ? '<span class="kicker" style="display:inline-block;background:var(--yellow);color:var(--navy);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px">' + esc(a.kicker) + "</span>" : "") +
      "<h2>" + esc(a.title) + "</h2>" + (a.text ? "<p>" + esc(a.text) + "</p>" : "") +
      "<ul>" + a.items.map(function(x){ return '<li><svg class="i"><use href="#i-check"/></svg>' + esc(x) + "</li>"; }).join("") + "</ul>" +
      (a.btn ? '<a class="btn btn-y" target="_blank" rel="noopener"><svg class="i"><use href="#i-wa"/></svg>' + esc(a.btn) + "</a>" : "");
    var l = box.querySelector("a"); if (l) l.href = wa("Bonjour " + S.store.name + ", je souhaite un devis pour une réparation.");
    $("atelier").hidden = !a.title;
    $("fservices").innerHTML = a.items.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("");
  }
  function renderBrands(){
    $("brands").innerHTML = S.brands.map(function(b){ return "<span>" + esc(b) + "</span>"; }).join("");
    $("brandsSec").hidden = !S.brands.length;
  }
  function renderFooter(){
    var st = S.store;
    var soc = [];
    if (st.instagram) soc.push('<li><a target="_blank" rel="noopener" href="https://www.instagram.com/' + encodeURIComponent(st.instagram.replace(/^@/, "")) + '">Instagram · ' + esc(st.instagram) + "</a></li>");
    if (st.facebook) soc.push('<li><a target="_blank" rel="noopener" href="https://www.facebook.com/' + encodeURIComponent(st.facebook.replace(/^@/, "")) + '">Facebook · ' + esc(st.facebook) + "</a></li>");
    if (st.tiktok) soc.push('<li><a target="_blank" rel="noopener" href="https://www.tiktok.com/@' + encodeURIComponent(st.tiktok.replace(/^@/, "")) + '">TikTok · ' + esc(st.tiktok) + "</a></li>");

      pick.textContent = "Traitement…";
      readImage(f, o.max, o.type, o.q).then(function(d){ set(d); changed(); paint(); pick.textContent = "Changer la photo"; inp.value = ""; },
        function(){ toast("Ce fichier n'est pas une image lisible. Choisissez un fichier JPG ou PNG."); pick.textContent = get() ? "Changer la photo" : "Choisir une photo"; inp.value = ""; });
    };
    row.appendChild(pv); row.appendChild(pick); row.appendChild(inp); row.appendChild(rm);
    w.appendChild(row);
    if (o.help) w.appendChild(el("small", null, o.help));
    paint(); return w;
  }
  function thumb(p){
    var th = el("div", "th");
    if (p.image) { var i = document.createElement("img"); i.src = p.image; i.alt = ""; th.appendChild(i); }
    else th.innerHTML = '<svg viewBox="0 0 200 140" aria-hidden="true"><use href="#' + esc(p.art || catOf(p.cat).art) + '"/></svg>';
    return th;
  }

  // ---- Onglets ----
  function renderAdmin(){
    if (!A.open) return;
    var tabs = $("admTabs"); tabs.innerHTML = "";
    TABS.forEach(function(t){ var b = el("button", A.tab === t[0] ? "on" : "", t[1]); b.type = "button"; b.onclick = function(){ A.tab = t[0]; A.edit = null; renderAdmin(); $("admBody").scrollTop = 0; }; tabs.appendChild(b); });
    var body = $("admBody"); body.innerHTML = "";
    ({ produits: tabProducts, categories: tabCats, bannieres: tabSlides, accueil: tabHome, magasin: tabStore })[A.tab](body);
  }

  var prodFilter = "";
  function tabProducts(body){
    if (A.edit) { var p = W.products.filter(function(x){ return x.id === A.edit; })[0]; if (p) { productEditor(body, p); return; } A.edit = null; }
    var top = el("div", "adm-row2");
    top.appendChild(sbtn("+ Ajouter un produit", function(){
      var p = { id: uid("p"), cat: prodFilter || (W.cats[0] && W.cats[0].id) || "", name: "Nouveau produit", specs: "", price: 0, oldPrice: null, badge: "", stock: "Disponibilité sur WhatsApp", image: "" };
      W.products.unshift(p); A.edit = p.id; changed(); renderAdmin();
    }, "primary"));
    body.appendChild(top);
    body.appendChild(select("Afficher", "prodFilter", [["", "Toutes les catégories"]].concat(W.cats.map(function(c){ return [c.id, c.label]; })), function(){ return prodFilter; }, function(v){ prodFilter = v; }, renderAdmin));
    var list = el("div", "plist");
    var items = W.products.filter(function(p){ return !prodFilter || p.cat === prodFilter; });
    if (!items.length) list.appendChild(el("p", "adm-help", "Aucun produit dans cette catégorie. Cliquez sur « Ajouter un produit »."));
    items.forEach(function(p){
      var idx = W.products.indexOf(p);
      var r = el("div", "prow"); r.appendChild(thumb(p));
      var nm = el("div", "nm"); var b = el("b", null, p.name || "(sans nom)");
      if (p.hidden) b.appendChild(el("span", "hpill", "masqué"));
      nm.appendChild(b); nm.appendChild(el("span", null, catOf(p.cat).label + " · " + fmt(p.price) + (isPromo(p) ? " (promo)" : "")));
      r.appendChild(nm);
      var ib = el("div", "ib");
      ib.appendChild(sbtn("Modifier", function(){ A.edit = p.id; renderAdmin(); $("admBody").scrollTop = 0; }, "primary"));
      ib.appendChild(sbtn("↑", function(){ move(W.products, idx, -1); }, "", idx === 0));
      ib.appendChild(sbtn("↓", function(){ move(W.products, idx, 1); }, "", idx === W.products.length - 1));
      ib.appendChild(delBtn(function(){ W.products.splice(W.products.indexOf(p), 1); delete cart[p.id]; changed(); renderAdmin(); }));
      r.appendChild(ib); list.appendChild(r);
    });
    body.appendChild(list);
    body.appendChild(el("p", "adm-help", "L'ordre de la liste est l'ordre d'affichage sur le site. Les 4 premiers produits de chaque catégorie apparaissent sur la page d'accueil."));
  }
  function productEditor(body, p){
    var head = el("div", "adm-row2");
    head.appendChild(sbtn("← Retour à la liste", function(){ A.edit = null; renderAdmin(); }));
    body.appendChild(head);
    var box = el("div", "abox");
    box.appendChild(field("Nom du produit", "p-name", function(){ return p.name; }, function(v){ p.name = v; }));
    box.appendChild(select("Catégorie", "p-cat", W.cats.map(function(c){ return [c.id, c.label]; }), function(){ return p.cat; }, function(v){ p.cat = v; }));
    box.appendChild(field("Caractéristiques", "p-specs", function(){ return p.specs; }, function(v){ p.specs = v; }, { area: true, ph: "Ex. Core i5 · 8 Go · SSD 512 Go · 15,6\" FHD" }));
    var g = el("div", "g2");
    g.appendChild(field("Prix (DA)", "p-price", function(){ return p.price; }, function(v){ p.price = v || 0; }, { type: "number" }));
    g.appendChild(field("Ancien prix (DA)", "p-old", function(){ return p.oldPrice; }, function(v){ p.oldPrice = v; }, { type: "number", help: "Pour une promo. Laisser vide sinon." }));
    box.appendChild(g);
    box.appendChild(field("Badge", "p-badge", function(){ return p.badge; }, function(v){ p.badge = v; }, { ph: "Ex. Nouveau, Idéal étudiants, Stock limité", help: "Petite étiquette sur la photo. Laisser vide pour aucune." }));
    box.appendChild(field("Disponibilité", "p-stock", function(){ return p.stock; }, function(v){ p.stock = v; }, { ph: "Ex. En stock, Sur commande", help: "Texte vert sous les caractéristiques. Laisser vide pour le masquer." }));
    box.appendChild(imageField("Photo du produit", "p-img", function(){ return p.image; }, function(v){ p.image = v; }, { max: 700, type: "image/jpeg", q: 0.82, help: "Une photo sur fond blanc rend le mieux. Elle est réduite automatiquement." }));
    if (!p.image) box.appendChild(select("Dessin affiché sans photo", "p-art", [["", "Celui de la catégorie"]].concat(ARTS), function(){ return p.art || ""; }, function(v){ p.art = v || undefined; }));
    box.appendChild(check("Masquer ce produit du site (sans le supprimer)", "p-hidden", function(){ return p.hidden; }, function(v){ p.hidden = v; }));
    body.appendChild(box);
    var foot = el("div", "adm-row2");
    foot.appendChild(sbtn("Terminé", function(){ A.edit = null; renderAdmin(); }, "primary"));
    foot.appendChild(delBtn(function(){ W.products.splice(W.products.indexOf(p), 1); delete cart[p.id]; A.edit = null; changed(); renderAdmin(); }));
    body.appendChild(foot);
  }

  function tabCats(body){
    body.appendChild(el("p", "adm-help", "Les catégories forment le menu bleu, les tuiles de l'accueil et les rayons. Une catégorie qui contient des produits ne peut pas être supprimée : déplacez ou supprimez d'abord ses produits."));
    W.cats.forEach(function(c, i){
      var n = W.products.filter(function(p){ return p.cat === c.id; }).length;
      var box = el("div", "abox");
      var h = el("div", "abox-h"); h.appendChild(el("h4", null, (c.label || "(sans nom)") + " · " + n + " produit" + (n > 1 ? "s" : "")));
      var ib = el("div", "ib");
      ib.appendChild(sbtn("↑", function(){ move(W.cats, i, -1); }, "", i === 0));
      ib.appendChild(sbtn("↓", function(){ move(W.cats, i, 1); }, "", i === W.cats.length - 1));
      ib.appendChild(delBtn(function(){ W.cats.splice(i, 1); changed(); renderAdmin(); }, n > 0, n > 0 ? "Cette catégorie contient des produits" : ""));
      h.appendChild(ib); box.appendChild(h);
      var g = el("div", "g2");
      g.appendChild(field("Nom", "c-name-" + c.id, function(){ return c.label; }, function(v){ c.label = v; }));
      g.appendChild(select("Dessin", "c-art-" + c.id, ARTS, function(){ return c.art; }, function(v){ c.art = v; }));
      box.appendChild(g); body.appendChild(box);
    });
    body.appendChild(sbtn("+ Ajouter une catégorie", function(){ W.cats.push({ id: uid("c"), label: "Nouvelle catégorie", art: "p-gpu" }); changed(); renderAdmin(); }, "primary"));
  }

  function tabSlides(body){
    body.appendChild(el("p", "adm-help", "Les bannières défilent en haut de la page. Utilisez des photos horizontales (paysage) : elles sont réduites automatiquement."));
    var actions = [["none", "Pas de bouton"], ["catalogue", "Aller au catalogue"], ["atelier", "Aller à la section atelier"], ["devis", "Demande de devis WhatsApp"]].concat(W.cats.map(function(c){ return ["cat:" + c.id, "Ouvrir : " + c.label]; }));
    W.slides.forEach(function(s, i){
      var box = el("div", "abox");
      var h = el("div", "abox-h"); h.appendChild(el("h4", null, "Bannière " + (i + 1)));
      var ib = el("div", "ib");
      ib.appendChild(sbtn("↑", function(){ move(W.slides, i, -1); }, "", i === 0));
      ib.appendChild(sbtn("↓", function(){ move(W.slides, i, 1); }, "", i === W.slides.length - 1));
      ib.appendChild(delBtn(function(){ W.slides.splice(i, 1); changed(); renderAdmin(); }, W.slides.length <= 1, W.slides.length <= 1 ? "Gardez au moins une bannière" : ""));
      h.appendChild(ib); box.appendChild(h);
      box.appendChild(field("Petite étiquette jaune", "s-k-" + i, function(){ return s.kicker; }, function(v){ s.kicker = v; }, { ph: "Ex. Gaming, Promo, Étudiants" }));
      box.appendChild(field("Titre", "s-t-" + i, function(){ return s.title; }, function(v){ s.title = v; }));
      box.appendChild(field("Texte", "s-x-" + i, function(){ return s.text; }, function(v){ s.text = v; }, { area: true }));
      var g = el("div", "g2");
      g.appendChild(field("Texte du bouton", "s-b-" + i, function(){ return s.btn; }, function(v){ s.btn = v; }));
      g.appendChild(select("Le bouton…", "s-a-" + i, actions, function(){ return s.action || "none"; }, function(v){ s.action = v; }));
      box.appendChild(g);
      box.appendChild(imageField("Photo de fond", "s-img-" + i, function(){ return s.image; }, function(v){ s.image = v; }, { max: 1800, type: "image/jpeg", q: 0.78, help: "Sans photo, la bannière affiche un fond bleu avec un dessin." }));
      if (!s.image) box.appendChild(select("Dessin (sans photo)", "s-art-" + i, ARTS, function(){ return s.art || "p-laptop"; }, function(v){ s.art = v; }));
      body.appendChild(box);
    });
    if (W.slides.length < 6) body.appendChild(sbtn("+ Ajouter une bannière", function(){ W.slides.push({ kicker: "", title: "Nouvelle bannière", text: "", btn: "Voir le catalogue", action: "catalogue", image: "", art: "p-laptop" }); changed(); renderAdmin(); }, "primary"));
  }

  function tabHome(body){
    var t = el("div", "abox"); t.appendChild(el("h4", null, "Barre de confiance (sous les bannières)"));
    t.appendChild(el("p", "adm-help", "Ex. Livraison 58 wilayas, Paiement à la livraison, Garantie 1 an. N'affichez que ce que vous proposez vraiment."));
    W.trust.forEach(function(x, i){
      var g = el("div", "g2");
      g.appendChild(field("Titre " + (i + 1), "t-t-" + i, function(){ return x.title; }, function(v){ x.title = v; }));
      g.appendChild(field("Sous-titre " + (i + 1), "t-x-" + i, function(){ return x.text; }, function(v){ x.text = v; }));
      t.appendChild(g);
      var g2 = el("div", "g2");
      g2.appendChild(select("Icône " + (i + 1), "t-i-" + i, ICONS, function(){ return x.icon; }, function(v){ x.icon = v; }));
      var wrap = el("div", "af"); wrap.appendChild(el("span", null, " "));
      wrap.appendChild(delBtn(function(){ W.trust.splice(i, 1); changed(); renderAdmin(); }));
      g2.appendChild(wrap); t.appendChild(g2);
    });
    if (W.trust.length < 4) t.appendChild(sbtn("+ Ajouter un point", function(){ W.trust.push({ icon: "i-check", title: "Nouveau point", text: "" }); changed(); renderAdmin(); }, "primary"));
    body.appendChild(t);

    var a = el("div", "abox"); a.appendChild(el("h4", null, "Section atelier"));
    a.appendChild(field("Étiquette", "a-k", function(){ return W.atelier.kicker; }, function(v){ W.atelier.kicker = v; }));
    a.appendChild(field("Titre", "a-t", function(){ return W.atelier.title; }, function(v){ W.atelier.title = v; }, { help: "Laisser vide pour masquer toute la section." }));
    a.appendChild(field("Texte", "a-x", function(){ return W.atelier.text; }, function(v){ W.atelier.text = v; }, { area: true }));
    a.appendChild(field("Services (un par ligne)", "a-i", function(){ return W.atelier.items.join("\n"); }, function(v){ W.atelier.items = v.split("\n").map(function(s){ return s.trim(); }).filter(Boolean); }, { area: true, help: "Aussi affichés dans le pied de page." }));
    a.appendChild(field("Texte du bouton devis", "a-b", function(){ return W.atelier.btn; }, function(v){ W.atelier.btn = v; }));
    body.appendChild(a);

    var m = el("div", "abox"); m.appendChild(el("h4", null, "Marques et note du catalogue"));
    m.appendChild(field("Marques (séparées par des virgules)", "b-list", function(){ return W.brands.join(", "); }, function(v){ W.brands = v.split(",").map(function(s){ return s.trim(); }).filter(Boolean); }, { area: true, help: "Laisser vide pour masquer la section." }));
    m.appendChild(field("Note sous le catalogue", "n-txt", function(){ return W.note; }, function(v){ W.note = v; }, { area: true }));
    body.appendChild(m);
  }

  function tabStore(body){
    var st = W.store;
    var b1 = el("div", "abox"); b1.appendChild(el("h4", null, "Identité"));
    b1.appendChild(imageField("Logo", "logo", function(){ return W.logo; }, function(v){ W.logo = v; }, { max: 400, type: "image/png", q: 1, help: "Image carrée de préférence." }));
    b1.appendChild(field("Nom du magasin", "st-name", function(){ return st.name; }, function(v){ st.name = v; }));
    b1.appendChild(field("Sous-titre sous le nom", "st-tag", function(){ return st.tagline; }, function(v){ st.tagline = v; }));
    b1.appendChild(field("Présentation (pied de page)", "st-about", function(){ return st.about; }, function(v){ st.about = v; }, { area: true }));
    body.appendChild(b1);
    var b2 = el("div", "abox"); b2.appendChild(el("h4", null, "Contact"));
    var g = el("div", "g2");
    g.appendChild(field("Téléphone 1", "st-p1", function(){ return st.phone1; }, function(v){ st.phone1 = v; }, { type: "tel" }));
    g.appendChild(field("Téléphone 2", "st-p2", function(){ return st.phone2; }, function(v){ st.phone2 = v; }, { type: "tel" }));
    b2.appendChild(g);
    b2.appendChild(field("Numéro WhatsApp des commandes", "st-wa", function(){ return st.whatsapp; }, function(v){ st.whatsapp = v; }, { type: "tel", help: "C'est ce numéro qui reçoit les commandes. Format 0663445136." }));
    b2.appendChild(field("E-mail", "st-mail", function(){ return st.email; }, function(v){ st.email = v; }, { type: "email" }));
    b2.appendChild(field("Adresse", "st-addr", function(){ return st.address; }, function(v){ st.address = v; }, { area: true }));
    b2.appendChild(field("Horaires d'ouverture", "st-hours", function(){ return st.hours; }, function(v){ st.hours = v; }, { area: true, ph: "Ex. Samedi – Jeudi : 9h – 19h" }));
    b2.appendChild(field("Recherche Google Maps", "st-maps", function(){ return st.maps; }, function(v){ st.maps = v; }, { help: "Ce que Google Maps doit chercher pour trouver le magasin." }));
    body.appendChild(b2);
    var b3 = el("div", "abox"); b3.appendChild(el("h4", null, "Réseaux sociaux"));
    b3.appendChild(field("Instagram (nom du compte)", "st-ig", function(){ return st.instagram; }, function(v){ st.instagram = v; }));
    b3.appendChild(field("Facebook (nom de la page)", "st-fb", function(){ return st.facebook; }, function(v){ st.facebook = v; }));
    b3.appendChild(field("TikTok (nom du compte)", "st-tk", function(){ return st.tiktok; }, function(v){ st.tiktok = v; }, { help: "Laisser vide si vous n'en avez pas." }));
    body.appendChild(b3);
  }

  // ---- Démarrage ----
  var draft = loadDraft();
  renderAll();

  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("artifact"), window.claude.use("user"), window.claude.use("downloads")]).then(function(r){
      ART = r[0];
      var user = r[1];
      DL = r[2]; $("admExport").hidden = !DL;
      return (user ? user.canEdit() : Promise.resolve(false)).then(function(ok){
        A.can = !!(ART && ok);
        if (!A.can) { if (location.hash === "#admin") toast("L'espace administrateur est réservé au propriétaire du site."); return; }
        $("admPill").hidden = false; $("adminLink").hidden = false;
        if (draft) { W = draft; S = W; A.dirty = true; renderAll(); }
        setStatus();
        if (location.hash === "#admin" || draft) openAdmin();
      });
    }).catch(function(){});
  }
  else {
    var saved = ghLoad();
    if (saved) {
      GH = saved; A.can = true; $("admPill").hidden = false; $("admLogout").hidden = false;
      if (draft) { W = draft; S = W; A.dirty = true; renderAll(); }
      setStatus();
      if (location.hash === "#admin" || draft) openAdmin();
    } else if (location.hash === "#admin") showLogin();
  }
  window.addEventListener("hashchange", function(){ if (location.hash === "#admin") openAdmin(); });
})();
</script>
</body>
</html>
